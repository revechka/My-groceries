<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#194e41"><title>Мои покупки</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#18342d;background:#f7f8f5}*{box-sizing:border-box}body{margin:0}header{background:#194e41;color:white;padding:18px 18px 15px;display:flex;align-items:center;gap:12px;min-height:68px}header h1{font-size:21px;margin:0;flex:1}button{font:inherit;cursor:pointer}header button{background:transparent;color:white;border:0;font-size:24px;padding:3px 8px}.wrap{max-width:600px;margin:auto;padding:20px 16px 110px}.home{display:grid;gap:16px;padding-top:28px}.big{border:1px solid #d6e4da;background:white;border-radius:18px;padding:34px 20px;text-align:left;box-shadow:0 3px 12px #102d1710;font-size:23px;font-weight:750;color:#194e41}.big small{display:block;font-size:13px;font-weight:400;color:#718078;margin-top:6px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.heading h2{font-size:18px;margin:0}.add{border:0;background:#194e41;color:white;border-radius:12px;padding:12px 16px;font-weight:650}.item{display:flex;align-items:center;gap:12px;background:white;border:1px solid #e2e8e2;border-radius:13px;padding:13px 12px;margin:8px 0;min-height:57px}.tick{appearance:none;width:25px;height:25px;border:2px solid #7e988b;border-radius:6px;margin:0;flex:none;cursor:pointer}.tick:checked{background:#1e8061;border-color:#1e8061}.tick:checked:after{content:'✓';display:block;text-align:center;color:white;font-size:19px;line-height:21px}.item .name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:17px}.item .name.needed{font-weight:700}.edit{border:0;background:#edf3ee;border-radius:9px;padding:8px 10px;color:#345a48}.sub{font-size:12px;color:#7b8b80;margin-top:3px}.store{width:100%;border:1px solid #dfe8e0;background:white;border-radius:13px;text-align:left;padding:19px 16px;font-size:18px;color:#194e41;margin:7px 0;display:flex;justify-content:space-between}.store span{font-size:13px;color:#718078}.empty{text-align:center;color:#78877d;padding:36px 10px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}.sheet h2{margin:0 0 20px;font-size:21px}.field{display:flex;align-items:center;gap:12px}.field input[type=text]{width:100%;min-width:0;flex:1;padding:13px;border:1px solid #cbd9ce;border-radius:10px;font-size:17px}.field label{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:14px}.section{margin-top:22px;font-weight:650}.choice{display:flex;align-items:center;justify-content:space-between;padding:13px 5px;border-bottom:1px solid #eef0ed;cursor:pointer}.dot{height:23px;width:23px;border:2px solid #8da99a;border-radius:50%;display:grid;place-items:center}.dot.on:after{content:'';width:11px;height:11px;background:#197956;border-radius:50%}.actions{display:flex;gap:9px;margin-top:25px}.actions button{flex:1;border-radius:11px;padding:13px;border:1px solid #d2dfd5;background:white}.actions .primary{background:#194e41;color:white;border-color:#194e41}.danger{color:#a33434!important}.hint{color:#7b8b80;font-size:13px;line-height:1.45;margin-top:10px}.utility{border:1px solid #cbd9ce;background:white;border-radius:10px;padding:11px;margin-top:12px;color:#194e41}#file{display:none}</style></head><body><header><button id="back" aria-label="Назад" hidden>‹</button><h1 id="title">Мои покупки</h1></header><main class="wrap" id="app"></main><div class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true"><h2 id="modalTitle">Продукт</h2><div class="field"><input id="productName" type="text" placeholder="Название продукта" maxlength="100"><label><input type="checkbox" class="tick" id="productNeeded"> Купить</label></div><div class="section">В каких магазинах бывает?</div><div id="storeChoices"></div><div class="actions"><button id="cancel">Отмена</button><button class="primary" id="save">Сохранить</button></div><div id="deleteWrap"></div></div></div><input id="file" type="file" accept="application/json"><script>
(()=>{'use strict';const KEY='grocery-ritka-v1';const defaultData={stores:[{id:'costco',name:'Costco'},{id:'trader',name:"Trader Joe’s"},{id:'market',name:'Market Basket'}],products:[]};let data;try{const saved=JSON.parse(localStorage.getItem(KEY));data=saved&&Array.isArray(saved.stores)&&Array.isArray(saved.products)?saved:structuredClone(defaultData)}catch{data=structuredClone(defaultData)}let page='home',storeId=null,editing=null,selected=[];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Не удалось сохранить данные. Проверь настройки браузера.')}};const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function navigate(p,s=null){page=p;storeId=s;render();scrollTo(0,0)}function sorted(products){return [...products].sort((a,b)=>Number(b.needed)-Number(a.needed)||a.order-b.order)}function render(){const back=page!=='home';$('back').hidden=!back;$('title').textContent=page==='home'?'Мои покупки':page==='products'?'Продукты':page==='stores'?'Магазины':data.stores.find(s=>s.id===storeId)?.name||'Магазин';let html='';if(page==='home'){html='<div class="home"><button class="big" data-nav="products">🥑 Продукты<small>Единый каталог и галочки «купить»</small></button><button class="big" data-nav="stores">🏬 Магазины<small>Ассортимент по магазинам</small></button></div><div style="margin-top:35px"><button class="utility" data-backup>↓ Сохранить резервную копию</button> <button class="utility" data-import>↑ Восстановить копию</button></div><p class="hint">Данные хранятся в браузере этого телефона. Для надёжности периодически сохраняй резервную копию.</p>'}else if(page==='stores'){html='<div class="heading"><h2>Мои магазины</h2></div>'+data.stores.map(s=>`<button class="store" data-store="${esc(s.id)}">${esc(s.name)} <span>${data.products.filter(p=>p.stores.includes(s.id)&&p.needed).length} купить ›</span></button>`).join('')+'<button class="utility" data-addstore>＋ Добавить магазин</button>'}else{const items=page==='products'?data.products:data.products.filter(p=>p.stores.includes(storeId));html=`<div class="heading"><h2>${page==='products'?'Все продукты':'Ассортимент магазина'}</h2><button class="add" data-add>＋ Продукт</button></div>`+(!items.length?'<div class="empty">Пока пусто. Добавь первый продукт.</div>':sorted(items).map(p=>`<div class="item"><input class="tick" type="checkbox" aria-label="Надо купить: ${esc(p.name)}" data-tick="${esc(p.id)}" ${p.needed?'checked':''}><div class="name ${p.needed?'needed':''}">${esc(p.name)}${page==='products'?`<div class="sub">${esc(p.stores.map(s=>data.stores.find(x=>x.id===s)?.name).filter(Boolean).join(' · ')||'Без магазина')}</div>`:''}</div><button class="edit" data-edit="${esc(p.id)}" aria-label="Изменить ${esc(p.name)}">✎</button></div>`).join(''))} $('app').innerHTML=html;}
$('back').onclick=()=>navigate(page==='store'?'stores':'home');$('app').onclick=e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.nav)navigate(t.dataset.nav);else if(t.dataset.store)navigate('store',t.dataset.store);else if(t.hasAttribute('data-add'))openEditor();else if(t.dataset.edit)openEditor(t.dataset.edit);else if(t.hasAttribute('data-addstore')){const name=prompt('Название нового магазина:');if(name?.trim()){data.stores.push({id:id(),name:name.trim()});persist();render()}}else if(t.hasAttribute('data-backup'))backup();else if(t.hasAttribute('data-import'))$('file').click()};$('app').onchange=e=>{const el=e.target;if(!el.dataset.tick)return;const p=data.products.find(x=>x.id===el.dataset.tick);if(p){p.needed=el.checked;persist();render()}};
function openEditor(productId=null){editing=productId;const p=data.products.find(x=>x.id===productId);$('modalTitle').textContent=p?'Редактировать продукт':'Новый продукт';$('productName').value=p?.name||'';$('productNeeded').checked=!!p?.needed;selected=p?[...p.stores]:page==='store'?[storeId]:[];renderChoices();$('deleteWrap').innerHTML=p?'<button class="utility danger" id="delete">Удалить продукт из базы</button>':'';$('modal').classList.add('show');if(p)$('delete').onclick=()=>{if(confirm('Удалить продукт из всех магазинов и общего каталога?')){data.products=data.products.filter(x=>x.id!==editing);persist();close();render()}};setTimeout(()=>$('productName').focus(),80)}function renderChoices(){$('storeChoices').innerHTML=data.stores.map(s=>`<div class="choice" data-choice="${esc(s.id)}"><span>${esc(s.name)}</span><span class="dot ${selected.includes(s.id)?'on':''}"></span></div>`).join('')}$('storeChoices').onclick=e=>{const el=e.target.closest('[data-choice]');if(!el)return;const sid=el.dataset.choice;selected=selected.includes(sid)?selected.filter(x=>x!==sid):[...selected,sid];renderChoices()};function close(){$('modal').classList.remove('show');editing=null}$('cancel').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('save').onclick=()=>{const name=$('productName').value.trim();if(!name){alert('Введи название продукта');return}const duplicate=data.products.find(p=>p.name.toLocaleLowerCase('ru')===name.toLocaleLowerCase('ru')&&p.id!==editing);if(duplicate){alert('Такой продукт уже есть. Открой его и добавь магазины.');return}const p=data.products.find(x=>x.id===editing);if(p){p.name=name;p.needed=$('productNeeded').checked;p.stores=[...selected]}else data.products.push({id:id(),name,needed:$('productNeeded').checked,stores:[...selected],order:data.products.length});persist();close();render()};function backup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moi-pokupki-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.stores)||!Array.isArray(d.products)||!d.stores.every(s=>typeof s.id==='string'&&typeof s.name==='string')||!d.products.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&typeof p.needed==='boolean'&&Array.isArray(p.stores)))throw Error();if(confirm('Заменить текущие данные данными из резервной копии?')){data=d;persist();navigate('home')}}catch{alert('Неподходящий файл резервной копии')}e.target.value=''};render()})();
</script></body></html>
